name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run regression and installer lifecycle suites
        shell: powershell
        run: |
          ./tests/ai-workers.tests.ps1
          ./tests/install-lifecycle.tests.ps1
      - name: Check tracked text files for credential-like literals
        shell: powershell
        run: |
          $files = @(git ls-files -- '*.ps1' '*.psm1' '*.json' '*.md' '*.yml' '*.yaml')
          $matches = @(
            foreach ($file in $files) {
              Select-String -LiteralPath $file -Pattern '(?i)\b(sk-[A-Za-z0-9_-]{8,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16})\b' -AllMatches
            }
          )
          if ($matches) { throw 'Credential-like literal found in a public file.' }

  windows-pwsh:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run regression and installer lifecycle suites
        shell: pwsh
        run: |
          ./tests/ai-workers.tests.ps1
          ./tests/install-lifecycle.tests.ps1
      - name: Check tracked text files for credential-like literals
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.ps1' '*.psm1' '*.json' '*.md' '*.yml' '*.yaml')
          $matches = @(
            foreach ($file in $files) {
              Select-String -LiteralPath $file -Pattern '(?i)\b(sk-[A-Za-z0-9_-]{8,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16})\b' -AllMatches
            }
          )
          if ($matches) { throw 'Credential-like literal found in a public file.' }
