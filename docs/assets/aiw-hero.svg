<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">AI CLI Orchestrator</title>
  <desc id="description">A language-neutral diagram showing a terminal routed through AIW to several workers and a structured result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#17102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48d7ff"/>
      <stop offset="0.5" stop-color="#6f8cff"/>
      <stop offset="1" stop-color="#b56cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#628bff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#628bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9db4dd" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7ba7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="210" rx="510" ry="300" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="url(#accent)" stroke-opacity="0.38" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="90" y="125" width="220" height="170" rx="22" fill="#0d192c" stroke="#3a638e" stroke-width="2"/>
    <circle cx="122" cy="153" r="6" fill="#ff6685"/>
    <circle cx="144" cy="153" r="6" fill="#ffcb65"/>
    <circle cx="166" cy="153" r="6" fill="#5de1ad"/>
    <path d="M112 177H288" stroke="#355070" stroke-width="2"/>
    <text x="200" y="245" fill="#8fe5ff" font-family="Consolas, monospace" font-size="58" font-weight="700" text-anchor="middle">&gt;_</text>

    <rect x="420" y="86" width="360" height="248" rx="34" fill="#14264a" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="600" cy="210" r="92" fill="#0e1b36" stroke="#718fff" stroke-width="3"/>
    <text x="600" y="235" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="750" letter-spacing="5" text-anchor="middle">AIW</text>

    <circle cx="910" cy="132" r="48" fill="#151b36" stroke="#6a73c7" stroke-width="2"/>
    <circle cx="910" cy="210" r="48" fill="#151b36" stroke="#7b66bd" stroke-width="2"/>
    <circle cx="910" cy="288" r="48" fill="#151b36" stroke="#8d5fb0" stroke-width="2"/>
    <circle cx="910" cy="132" r="13" fill="#48d7ff"/>
    <circle cx="910" cy="210" r="13" fill="#7e92ff"/>
    <circle cx="910" cy="288" r="13" fill="#c178ff"/>

    <rect x="1032" y="135" width="110" height="150" rx="22" fill="#151a30" stroke="#715b9e" stroke-width="2"/>
    <text x="1087" y="230" fill="#d7baff" font-family="Consolas, monospace" font-size="58" font-weight="700" text-anchor="middle">{ }</text>
  </g>

  <g fill="none" stroke="#7ba7ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M330 210H392"/>
    <path d="M808 210H838"/>
    <path d="M976 210H1008"/>
  </g>

  <g fill="#6889ca" opacity="0.8">
    <circle cx="350" cy="210" r="5"/>
    <circle cx="828" cy="210" r="5"/>
    <circle cx="998" cy="210" r="5"/>
  </g>
</svg>
